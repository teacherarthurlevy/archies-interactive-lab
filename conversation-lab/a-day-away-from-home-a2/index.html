<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Day Away From Home | Conversation Lab A2</title><style>*{box-sizing:border-box}body{margin:0;background:#F5F2EF;color:#22242D;font:16px/1.55 'DejaVu Sans',Arial,sans-serif}header{background:#22242D;color:white;padding:25px 5vw}header small{color:#d6a98b;letter-spacing:2px}h1{margin:8px 0;font-size:clamp(26px,5vw,46px)}h2{margin:0 0 10px}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #B98562;border-radius:9px;padding:10px 14px;background:white;color:#22242D}button:hover{background:#F5F2EF}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #B98562}button:disabled{opacity:.5;cursor:default}.primary,.active{background:#22242D;color:white}.primary:hover,.active:hover{background:#64616A}.layout{display:flex;max-width:1400px;margin:auto;gap:18px;padding:18px}aside{width:260px;flex-shrink:0}aside.closed{width:55px}aside.closed #nav,aside.closed .sideinfo{display:none}#nav button{display:block;width:100%;text-align:left;margin:7px 0}main{min-width:0;flex:1}.card{background:white;border:1px solid #dfd8d1;border-radius:16px;padding:clamp(14px,3vw,30px);margin-bottom:16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.score{background:#fff;border-radius:10px;padding:12px;margin:10px 0}.bar{height:10px;background:#ded7d1;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#B98562}.scene{background:#F5F2EF;border-radius:14px;text-align:center;padding:20px;font-size:clamp(40px,9vw,90px);letter-spacing:8px}.option{display:block;width:100%;text-align:left;margin:8px 0}.correct{border:2px solid #22242D;background:#e4dad2}.wrong{border:2px dashed #64616A}.muted{color:#64616A}textarea{width:100%;min-height:100px;padding:12px;border:1px solid #B98562;border-radius:8px}input{max-width:100%;padding:8px;border:1px solid #B98562;border-radius:8px}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}a{color:#22242D}footer{text-align:center;padding:20px;color:#64616A;font-size:12px}@media(max-width:700px){.layout{display:block;padding:10px}aside,aside.closed{width:100%;margin-bottom:12px}#nav{display:grid;grid-template-columns:1fr 1fr;gap:5px}#nav button{margin:0;font-size:13px}}.prompt{border-left:4px solid #B98562;padding:12px;background:#F5F2EF;margin:12px 0}.tag{font-size:12px;letter-spacing:1px;color:#64616A}.choice{margin:8px 0}.scene{font-size:30px;letter-spacing:0}.timer{font-weight:bold;color:#64616A}details{margin:10px 0}summary{cursor:pointer}label{display:block;margin:10px 0}</style></head><body><header><small>EDUCATION WITH ARCHIE · CONVERSATION LAB · A2 · 60 MIN</small><h1>A Day Away From Home</h1><p>Explore a new city. Connect with people. Use everyday English.</p></header><div class="layout"><aside id="side"><button id="toggle" onclick="s.closed=!s.closed;draw()"></button><div class="sideinfo"><div id="progress"></div><button onclick="reset()">Reset progress</button></div><nav id="nav" aria-label="Missions"></nav></aside><main id="content"></main></div><footer>EDUCATION WITH ARCHIE · ANYBODY CAN SPEAK ENGLISH, YOU JUST DON'T KNOW YET.</footer><script>const D={"names":["Let's Talk About Your Day","Six Words to Explore the World","Yesterday, Today & Tomorrow","Your Day, Your Choices","Meeting Someone New","Everyday Problems Abroad","Plan Your Perfect Day","Final Quest & Reflection"],"times":[7,6,8,10,8,8,7,6],"warm":["What do you usually do on a free Saturday?","Do you prefer quiet places or busy places? Why?","When you visit a new city, what do you like to do first?","Tell me about a nice day you had recently."],"words":[["nearby","perto / nas proximidades","not far away","Is there a café nearby?","What is a nice place near your home?"],["crowded","lotado","full of people","The market is crowded today.","Do you like crowded places?"],["affordable","acessível (preço)","not too expensive","This restaurant is affordable.","What is an affordable activity in your city?"],["recommend","recomendar","suggest something good","Can you recommend a good place to eat?","What would you recommend to a visitor?"],["comfortable","confortável","pleasant and easy to relax in","These shoes are comfortable.","What clothes do you feel comfortable in?"],["available","disponível","free or ready to use","Is this table available?","When are you available to meet a friend?"]],"quiz":[["I usually ___ coffee in the morning.",["drink","drank","am going to drink yesterday"],0,"Usually describes a habit: present simple."],["Yesterday we ___ a beautiful park.",["visit","visited","are going to visit"],1,"Yesterday refers to a finished past action."],["Tomorrow I ___ explore the city.",["went to","usually","am going to"],2,"Going to expresses a future plan."],["She ___ like crowded places.",["doesn't","don't","didn't yesterday"],0,"Use doesn't with she for present habits."],["Did you ___ the local food?",["tried","try","trying"],1,"After did, use the base verb."],["We are going to ___ a friend tonight.",["met","meeting","meet"],2,"Going to + base verb."]],"plans":[["Morning · You have three hours and €25.",["A quiet café and a walk (€12)","A museum and coffee (€23)","A shopping trip (€25)"],[12,23,25]],["Afternoon · You have €35.",["A picnic in the park (€10)","A guided city walk (€20)","Lunch and a local market (€30)"],[10,20,30]],["Evening · You have €30.",["Dinner at a small restaurant (€22)","A free concert and a snack (€8)","A cinema and dessert (€25)"],[22,8,25]]],"dialog":[["A friendly person at a café says: Hi! Is this seat taken?",["No, go ahead!","I am seat yesterday.","Why you sit?"],0,["Great, thanks! Are you visiting the city?","They look confused and ask again.","They seem unsure whether you want company."]],["They ask: What do you like doing in your free time?",["I liked tomorrow.","I enjoy walking and trying new food.","I am free time."],1,["They ask you to explain.","Nice! I love walking too. Have you found any good places?","They ask what you mean."]],["They say: I'm going to the market later. Would you like to come?",["I went tomorrow.","You go yesterday.","That sounds nice! What time are you going?"],2,["They ask if you mean today.","They are confused about the time.","Around three. Let's meet outside the café!"]]],"problems":[["Your phone battery is almost empty and you need directions.","Excuse me, could you tell me how to get to the park?","Ask for directions, repeat them and check your understanding."],["You ordered a sandwich, but you received a salad.","Sorry, I ordered a sandwich. Could you check, please?","Explain the problem politely and ask for a solution."],["A friend wants to meet at 6, but you are busy until 7.","I'm not available at six. Can we meet at seven instead?","Explain your schedule and suggest another time."],["It starts raining during your walk.","Let's find somewhere comfortable nearby.","Suggest an indoor activity and explain why."]]};

const $=x=>document.getElementById(x),key='archie-day-away-a2-v1',fresh=()=>({m:0,done:[],skip:[],card:0,reveal:false,seen:[],a:{},plans:{},dialog:{},practice:{},notes:{},checks:{},closed:false});let s=fresh();try{s={...s,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}function draw(){save();render()}function go(i){s.m=i;draw();scrollTo(0,0)}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const card=x=>'<section class="card">'+x+'</section>';function note(k,p){return '<textarea id="note-'+k+'" placeholder="'+esc(p)+'" oninput="s.notes[\''+k+'\']=this.value;save()">'+esc(s.notes[k])+'</textarea><button onclick="copy(\''+k+'\')">Copy response</button>'}function copy(k){let t=$('note-'+k);navigator.clipboard.writeText(t.value).catch(()=>{t.select();document.execCommand('copy')})}function check(k,label){return '<label><input type="checkbox" '+(s.checks[k]?'checked':'')+' onchange="s.checks[\''+k+'\']=this.checked;draw()"> '+label+'</label>'}function answer(i,j){if(s.a[i]===D.quiz[i][2])return;s.a[i]=j;draw()}function move(n){s.card=(s.card+n+6)%6;s.reveal=false;draw()}function reveal(){s.reveal=!s.reveal;if(s.reveal&&!s.seen.includes(s.card))s.seen.push(s.card);draw()}function ready(){return [()=>s.checks.warm,()=>s.seen.length===6,()=>D.quiz.every((q,i)=>s.a[i]===q[2]),()=>D.plans.every((_,i)=>s.plans[i]!==undefined)&&s.checks.plan,()=>D.dialog.every((q,i)=>s.dialog[i]===q[2]),()=>D.problems.every((_,i)=>s.practice[i]),()=>s.checks.create&&!!(s.notes.create||'').trim(),()=>s.checks.final&&s.checks.reflect][s.m]()}function complete(){if(ready()&&!s.done.includes(s.m)){s.done.push(s.m);s.skip=s.skip.filter(i=>i!==s.m)}draw()}function skip(){if(!s.done.includes(s.m)&&!s.skip.includes(s.m))s.skip.push(s.m);go(Math.min(7,s.m+1))}
function render(){let m=s.m;$('side').classList.toggle('closed',s.closed);$('toggle').textContent=s.closed?'☰':'Collapse ☰';$('nav').innerHTML=D.names.map((n,i)=>'<button class="'+(m===i?'active':'')+'" onclick="go('+i+')">'+(s.done.includes(i)?'✓ ':s.skip.includes(i)?'↷ ':'')+(i+1)+' · '+n+'</button>').join('');$('progress').innerHTML='<b>'+s.done.length+'/8 missions · '+s.done.length*50+'/400 XP</b><div class="bar"><span style="width:'+s.done.length*12.5+'%"></span></div>';let h=card('<div class="tag">MISSION '+(m+1)+' / 8 · '+D.times[m]+' MIN</div><h2>'+D.names[m]+'</h2>');
if(m===0)h+=card('<p>Imagine you have a free day in a new city. Talk about your real life first.</p>'+D.warm.map(q=>'<div class="prompt">'+q+'<br><small>Follow-up: Why? Can you give an example?</small></div>').join('')+'<details><summary>Useful starters</summary>I usually… / I prefer… because… / Last weekend I…</details>'+check('warm','We discussed the questions.'));
if(m===1){let w=D.words[s.card];h+=card('<div class="scene">'+w[0]+'</div><p>Card '+(s.card+1)+'/6 · '+s.seen.length+' discovered</p>'+(s.reveal?'<p><b>'+w[1]+'</b> · '+w[2]+'</p><p>'+w[3]+'</p>':'<p>What do you think this word means?</p>')+'<div class="row"><button onclick="move(-1)">Previous</button><button class="primary" onclick="reveal()">Reveal / hide</button><button onclick="move(1)">Next / skip card</button></div><div class="prompt">Speak: '+w[4]+'</div>')}
if(m===2){h+=card('<h3>Three time frames</h3><p><b>Every day:</b> I usually walk to work.</p><p><b>Yesterday:</b> I walked around the city.</p><p><b>Tomorrow:</b> I am going to visit a museum.</p><p>Notice: did + base verb; going to + base verb.</p>');D.quiz.forEach((q,i)=>h+=card('<h3>'+q[0]+'</h3>'+q[1].map((v,j)=>'<button class="option '+(s.a[i]===j?(j===q[2]?'correct':'wrong'):'')+'" '+(s.a[i]===q[2]?'disabled':'')+' onclick="answer('+i+','+j+')">'+v+'</button>').join('')+(s.a[i]===undefined?'':'<p>'+ (s.a[i]===q[2]?'Correct! '+q[3]:'Try again. '+q[3])+'</p>')));h+=card('<div class="prompt">Tell me one thing you usually do, one thing you did yesterday and one thing you are going to do tomorrow.</div>')}
if(m===3){let total=D.plans.reduce?0:Object.keys(s.plans).reduce((a,i)=>a+D.plans[i][2][s.plans[i]],0);total=Object.keys(s.plans).reduce((a,i)=>a+D.plans[i][2][s.plans[i]],0);h+=card('<p>You have €90 for a fictional day out. Choose one activity in each period. Explain your preferences and compare the alternatives.</p><h3>Spent: €'+total+' · Remaining: €'+(90-total)+'</h3>');D.plans.forEach((q,i)=>h+=card('<h3>'+q[0]+'</h3>'+q[1].map((v,j)=>'<button class="option '+(s.plans[i]===j?'active':'')+'" onclick="s.plans['+i+']='+j+';draw()">'+v+'</button>').join('')+'<p>Why this option? Is it affordable, interesting or comfortable?</p>'));h+=card('<div class="prompt">Surprise: it starts raining. Which plan would you change? Explain.</div>'+check('plan','I explained my choices and adapted my plan.'))}
if(m===4){D.dialog.forEach((q,i)=>{if(i>0&&s.dialog[i-1]!==D.dialog[i-1][2])return;let a=s.dialog[i];h+=card('<div class="prompt">'+q[0]+'</div>'+q[1].map((v,j)=>'<button class="option '+(a===j?(j===q[2]?'correct':'wrong'):'')+'" '+(a===q[2]?'disabled':'')+' onclick="s.dialog['+i+']='+j+';draw()">'+v+'</button>').join('')+(a===undefined?'':'<p>'+q[3][a]+(a!==q[2]?' Try a different reply.':'')+'</p>'))});h+=card('<p>Role-play the conversation again without reading. Ask your partner two questions about their life.</p>')}
if(m===5)D.problems.forEach((q,i)=>h+=card('<h3>Situation '+(i+1)+'</h3><p>'+q[0]+'</p><div class="prompt">'+q[2]+'</div><details><summary>Reveal a useful expression</summary>'+q[1]+'</details><label><input type="checkbox" '+(s.practice[i]?'checked':'')+' onchange="s.practice['+i+']=this.checked;draw()"> Role-play completed</label>'));
if(m===6)h+=card('<p>Plan a perfect day for a friend visiting your city. Include a morning activity, lunch, an afternoon activity and an evening plan. Explain why you recommend each place.</p><div class="prompt">In the morning, we are going to… / I recommend… because… / After lunch… / If it rains, we can…</div>'+note('create','Write your plan here, then present it aloud.')+check('create','I presented my plan and answered follow-up questions.'));
if(m===7)h+=card('<h3>Final speaking quest · 60–90 seconds</h3><p>Tell a new friend about your typical day, something you did recently and your plans for tomorrow. Use at least three new words and ask one question.</p>'+check('final','I completed the speaking challenge.')+'<h3>Reflection</h3><p>What can you say more confidently now? What would you like to practice again?</p>'+note('reflect','My reflection…')+check('reflect','I reflected on my learning.')+'<h3>Results</h3><p>'+s.done.length+'/8 completed · '+s.done.length*50+'/400 XP · '+s.skip.length+' skipped</p><p>Vocabulary: '+s.seen.length+'/6 · Grammar: '+D.quiz.filter((q,i)=>s.a[i]===q[2]).length+'/6</p><button onclick="report()">Copy final report</button>');
h+=card('<div class="row"><button onclick="go(Math.max(0,s.m-1))" '+(m===0?'disabled':'')+'>Previous</button><button class="primary" onclick="complete()" '+(!ready()||s.done.includes(m)?'disabled':'')+'>'+(s.done.includes(m)?'Completed ✓':'Complete +50 XP')+'</button><button onclick="skip()">Skip mission</button><button onclick="go(Math.min(7,s.m+1))" '+(m===7?'disabled':'')+'>Next mission</button></div>');$('content').innerHTML=h}
function report(){navigator.clipboard.writeText('Education With Archie | A Day Away From Home\nMissions: '+s.done.length+'/8 | XP: '+s.done.length*50+'\nPlan: '+(s.notes.create||'')+'\nReflection: '+(s.notes.reflect||'')).catch(()=>alert('Copy unavailable. Select your results manually.'))}function reset(){if(confirm('Reset all lesson progress?')){s=fresh();draw()}}render();
</script></body></html>
