<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Real Problems, Real Conversations | A2–B1</title><style>*{box-sizing:border-box}body{margin:0;background:#F5F2EF;color:#22242D;font:16px/1.55 'DejaVu Sans',Arial,sans-serif}header{background:#22242D;color:white;padding:25px 5vw}header small{color:#d6a98b;letter-spacing:2px}h1{margin:8px 0;font-size:clamp(26px,5vw,46px)}h2{margin:0 0 10px}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #B98562;border-radius:9px;padding:10px 14px;background:white;color:#22242D}button:hover{background:#F5F2EF}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #B98562}button:disabled{opacity:.5;cursor:default}.primary,.active{background:#22242D;color:white}.primary:hover,.active:hover{background:#64616A}.layout{display:flex;max-width:1400px;margin:auto;gap:18px;padding:18px}aside{width:260px;flex-shrink:0}aside.closed{width:55px}aside.closed #nav,aside.closed .sideinfo{display:none}#nav button{display:block;width:100%;text-align:left;margin:7px 0}main{min-width:0;flex:1}.card{background:white;border:1px solid #dfd8d1;border-radius:16px;padding:clamp(14px,3vw,30px);margin-bottom:16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.score{background:#fff;border-radius:10px;padding:12px;margin:10px 0}.bar{height:10px;background:#ded7d1;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#B98562}.scene{background:#F5F2EF;border-radius:14px;text-align:center;padding:20px;font-size:clamp(40px,9vw,90px);letter-spacing:8px}.option{display:block;width:100%;text-align:left;margin:8px 0}.correct{border:2px solid #22242D;background:#e4dad2}.wrong{border:2px dashed #64616A}.muted{color:#64616A}textarea{width:100%;min-height:100px;padding:12px;border:1px solid #B98562;border-radius:8px}input{max-width:100%;padding:8px;border:1px solid #B98562;border-radius:8px}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}a{color:#22242D}footer{text-align:center;padding:20px;color:#64616A;font-size:12px}@media(max-width:700px){.layout{display:block;padding:10px}aside,aside.closed{width:100%;margin-bottom:12px}#nav{display:grid;grid-template-columns:1fr 1fr;gap:5px}#nav button{margin:0;font-size:13px}}.prompt{border-left:4px solid #B98562;padding:12px;background:#F5F2EF;margin:12px 0}.tag{font-size:12px;letter-spacing:1px;color:#64616A}.choice{margin:8px 0}.scene{font-size:30px;letter-spacing:0}.timer{font-weight:bold;color:#64616A}details{margin:10px 0}summary{cursor:pointer}label{display:block;margin:10px 0}.phone{max-width:380px;margin:auto;background:#22242D;padding:12px;border-radius:20px}.bubble{background:#F5F2EF;padding:14px;border-radius:12px}.reply{background:#B98562;padding:12px;border-radius:12px;margin-left:30px}.prompt{border-left:4px solid #B98562;padding:12px;background:#F5F2EF;margin:12px 0}label{display:block;margin:10px 0}</style></head><body><header><small>EDUCATION WITH ARCHIE · CONVERSATION LAB · A2–B1 · 60 MIN</small><h1>Real Problems, Real Conversations</h1><p>Listen. Understand. Express yourself. Find solutions.</p></header><div class="layout"><aside id="side"><button id="toggle" onclick="s.closed=!s.closed;draw()"></button><div class="sideinfo"><div id="progress"></div><button onclick="reset()">Reset progress</button></div><nav id="nav" aria-label="Missions"></nav></aside><main id="content"></main></div><footer>EDUCATION WITH ARCHIE · ANYBODY CAN SPEAK ENGLISH, YOU JUST DON'T KNOW YET.</footer><script>const D={"names":["Let's Talk About Real Life","Words That Make a Difference","Listening Detective","The Language of Empathy","The Problem-Solving Room","Reply to the Chat","Make a Difference","Final Quest"],"times":[5,6,15,7,8,7,7,5],"words":[["struggle","enfrentar dificuldades","have difficulty doing something","Some families struggle to pay rent."],["support","apoiar / apoio","help someone who needs it","We can support our neighbors."],["concerned","preocupado","worried about a situation","I'm concerned about the cost of food."],["volunteer","trabalhar como voluntário","offer your time to help","We could volunteer at a local shelter."],["resources","recursos","things or services that help people","The community needs more resources."],["fundraiser","campanha de arrecadação","an event or activity that collects money for a cause","Let's organize a fundraiser for school supplies."]],"clips":[["Feelings and poverty",102,196,"1:42–3:16"],["Listening and offering help",477,575,"7:57–9:35"],["Community action",673,710,"11:13–11:50"],["Neutral language and solutions",802,930,"13:22–15:30"],["Conversation structure",1042,1073,"17:22–17:53"]],"listen":[["1:42–2:32","What do the speakers suggest doing when a friend feels low?",["Ask gently how they feel.","Tell them to stop feeling sad.","Avoid speaking to them."],0,"They recommend gentle check-ins and comforting responses."],["2:37–3:16","Which difficulty is mentioned as an example of poverty?",["Choosing a holiday destination.","Paying for books or school uniforms.","Finding a new hobby."],1,"The speakers mention school costs, food, housing and healthcare."],["7:57–8:48","What should you do before offering advice?",["Change the subject.","Give instructions immediately.","Listen carefully."],2,"The speakers emphasize listening before advice."],["9:05–9:35","What problem does the fictional friend have?",["They lost their job and cannot easily pay rent.","They missed a bus.","They lost a phone."],0,"The role-play concerns job loss and rent."],["11:13–11:50","Which community action is suggested?",["Cancel all local events.","Collect donations through a fundraiser.","Avoid community programs."],1,"The speakers suggest donations, volunteering and fundraising."],["13:22–14:16","How do the speakers suggest starting a conversation about difficult news?",["Blame someone immediately.","Give orders.","Describe the situation neutrally."],2,"They recommend a neutral observation before expressing feelings."],["14:31–15:30","What is the example dialogue about?",["Children who do not have enough food.","A delayed flight.","A sports competition."],0,"The speakers discuss children, meals and possible donations."],["17:22–17:53","Which sequence best reflects their communication strategy?",["Give advice, blame, leave.","Observe, express feelings, offer support and listen.","Ignore, criticize, change the subject."],1,"They combine observation, feelings, support and gentle listening."]],"grammar":[["We ___ donate food to a local charity.",["can","can to","cans"],0,"Can + base verb."],["Maybe we ___ organize a school supply drive.",["could to","could","could organizing"],1,"Could + base verb makes a suggestion."],["Would you like me ___ you find information?",["help","helping","to help"],2,"Would you like me to + verb."],["I feel ___ about families in need.",["concerned","concern","concerning me"],0,"Feel + adjective."],["___ there any support programs nearby?",["Is","Are","Do"],1,"Are there + plural noun."],["Which response is gentler?",["You must fix everything now.","You are wrong.","Maybe we can look for a solution together."],2,"Maybe and can soften a suggestion."]],"scenarios":[["A community center needs school supplies.",["Organize a voluntary collection with the center.","Promise supplies without checking what is needed.","Ignore the center's request."],["You coordinate useful donations.","You may collect unsuitable items.","The need remains."],0],["A friend seems upset after a difficult day.",["Tell them what to do immediately.","Ask if they want to talk and listen.","Demand personal details."],["They may feel unheard.","You give them space to choose.","They may feel uncomfortable."],1],["A neighborhood group wants to improve safety.",["Spread unverified rumors.","Confront strangers alone.","Discuss safe options with responsible local organizations."],["Rumors may cause confusion.","This may create unnecessary risk.","You support a constructive, safer approach."],2]],"chat":[["Mia","I feel lonely lately. I don't really want to go out.",["I'm sorry you're feeling this way. Would you like to talk?","Just be happy.","You must go out now."],0,"Acknowledge feelings and offer a choice."],["Leo","My family is having trouble paying bills.",["That's your problem.","That sounds difficult. Would you like help finding local resources?","I promise to pay every bill."],1,"Offer realistic help without making promises."],["Sam","I saw a story about children who need school supplies.",["Who cares?","Let's blame everyone.","Maybe we can ask a local charity what they need."],2,"Suggest a practical action."],["Ava","I don't want advice right now. I just need someone to listen.",["Of course. I'm here to listen.","You must follow my advice.","Tell me every private detail."],0,"Respect the person's boundaries."]]};

const $=x=>document.getElementById(x),key='archie-real-problems-v1',fresh=()=>({m:0,done:[],skip:[],seen:[],c:0,rev:false,a:{},g:{},chat:{},sc:{},checks:{},notes:{},clip:0,closed:false});let s=fresh();try{s={...s,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}function draw(){save();render()}function go(i){s.m=i;draw();scrollTo(0,0)}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const card=x=>'<section class="card">'+x+'</section>';function check(k,t){return '<label><input type="checkbox" '+(s.checks[k]?'checked':'')+' onchange="s.checks[\''+k+'\']=this.checked;save();buttons()"> '+t+'</label>'}function note(k,t){return '<textarea id="note-'+k+'" placeholder="'+esc(t)+'" oninput="s.notes[\''+k+'\']=this.value;save();buttons()">'+esc(s.notes[k])+'</textarea><button onclick="copy(\''+k+'\')">Copy response</button>'}function copy(k){let t=$('note-'+k);navigator.clipboard.writeText(t.value).catch(()=>{t.select();document.execCommand('copy')})}function move(n){s.c=(s.c+n+6)%6;s.rev=false;draw()}function reveal(){s.rev=!s.rev;if(s.rev&&!s.seen.includes(s.c))s.seen.push(s.c);draw()}function quiz(q,i,k){let a=s[k][i],correct=q[2];return q[1].map((v,j)=>'<button class="option '+(a===j?(j===correct?'correct':'wrong'):'')+'" '+(a===correct?'disabled':'')+' onclick="s.'+k+'['+i+']='+j+';draw()">'+esc(v)+'</button>').join('')+(a===undefined?'':'<p>'+(a===correct?'Correct! '+q[3]:'Not quite. Try again.')+'</p>')}function ready(){return [()=>s.checks.warm,()=>s.seen.length===6,()=>D.listen.every((q,i)=>s.a[i]===q[3]),()=>D.grammar.every((q,i)=>s.g[i]===q[2]),()=>D.scenarios.every((q,i)=>s.sc[i]!==undefined)&&s.checks.solutions,()=>D.chat.every((q,i)=>s.chat[i]===q[3]),()=>s.checks.create&&!!(s.notes.create||'').trim(),()=>s.checks.final&&s.checks.reflect][s.m]()}function buttons(){if($('complete'))$('complete').disabled=!ready()||s.done.includes(s.m)}function complete(){if(ready()&&!s.done.includes(s.m)){s.done.push(s.m);s.skip=s.skip.filter(i=>i!==s.m)}draw()}function skip(){if(!s.done.includes(s.m)&&!s.skip.includes(s.m))s.skip.push(s.m);go(Math.min(7,s.m+1))}
function clip(i){s.clip=i;save();player()}function player(){let q=D.clips[s.clip];$('player').innerHTML='<iframe title="Podcast selected segment" src="https://www.youtube-nocookie.com/embed/onKLU0_G5oU?start='+q[1]+'&end='+q[2]+'" allowfullscreen></iframe><p><a href="https://www.youtube.com/watch?v=onKLU0_G5oU&t='+q[1]+'s" target="_blank" rel="noopener">Open segment on YouTube</a> · Stop at '+q[3].split('–')[1]+'</p>';document.querySelectorAll('[data-clip]').forEach(b=>b.classList.toggle('active',Number(b.dataset.clip)===s.clip))}
function render(){let m=s.m;$('side').classList.toggle('closed',s.closed);$('toggle').textContent=s.closed?'☰':'Collapse ☰';$('nav').innerHTML=D.names.map((n,i)=>'<button class="'+(m===i?'active':'')+'" onclick="go('+i+')">'+(s.done.includes(i)?'✓ ':s.skip.includes(i)?'↷ ':'')+(i+1)+' · '+n+'</button>').join('');$('progress').innerHTML='<b>'+s.done.length+'/8 · '+s.done.length*50+'/400 XP</b><div class="bar"><span style="width:'+s.done.length*12.5+'%"></span></div>';let h=card('<small>MISSION '+(m+1)+' · '+D.times[m]+' MIN</small><h2>'+D.names[m]+'</h2>');
if(m===0)h+=card('<p>Today we discuss social problems and kind communication. Use fictional examples; you never need to share personal experiences. You may skip any sensitive topic.</p>'+['What makes someone a good listener?','What problems can a community face?','What small actions can help people?','Is it better to listen first or give advice immediately? Why?'].map(q=>'<div class="prompt">'+q+'</div>').join('')+'<details><summary>Sentence starters</summary>I think… / In my opinion… / We can… / A good friend…</details>'+check('warm','I discussed the questions.'));
if(m===1){let w=D.words[s.c];h+=card('<div class="scene" style="font-size:32px;letter-spacing:0">'+w[0]+'</div><p>Card '+(s.c+1)+'/6 · '+s.seen.length+' discovered</p>'+(s.rev?'<p><b>'+w[1]+'</b> · '+w[2]+'</p><p>'+w[3]+'</p>':'<p>Guess the meaning.</p>')+'<div class="row"><button onclick="move(-1)">Previous</button><button onclick="reveal()">Reveal / hide</button><button onclick="move(1)">Next / skip card</button></div><p>Speak: Make your own example using this word.</p>')}
if(m===2){h+=card('<p>Talk Emma · Emma and Jack · Social problems. Watch five short segments (about 7 minutes total), then answer. The full episode is about 23 minutes.</p><div class="row">'+D.clips.map((q,i)=>'<button data-clip="'+i+'" onclick="clip('+i+')">'+q[3]+' · '+q[0]+'</button>').join('')+'</div><div id="player"></div><a href="https://www.youtube.com/watch?v=onKLU0_G5oU" target="_blank" rel="noopener">Full episode</a>');D.listen.forEach((q,i)=>h+=card('<small>'+q[0]+'</small><h3>'+q[1]+'</h3>'+quiz([q[1],q[2],q[3],q[4]],i,'a')))}
if(m===3){h+=card('<h3>Observe → Feel → Offer support → Listen</h3><p>I read about a local problem. I feel concerned. Maybe we can help. What do you think?</p><p><b>Can / could / should + base verb</b> · We could donate books. Should can be useful for general suggestions, but avoid sounding demanding when someone shares a personal problem.</p><p><b>Feel + adjective</b> · I feel worried.</p><p><b>Would you like me to + verb?</b> · Would you like me to help?</p>');D.grammar.forEach((q,i)=>h+=card('<h3>'+q[0]+'</h3>'+quiz(q,i,'g')))}
if(m===4){D.scenarios.forEach((q,i)=>{let a=s.sc[i];h+=card('<h3>'+q[0]+'</h3>'+q[1].map((v,j)=>'<button class="option '+(a===j?'active':'')+'" onclick="s.sc['+i+']='+j+';draw()">'+v+'</button>').join('')+(a===undefined?'':'<p class="prompt">'+q[2][a]+'</p><p>Why did you choose this? What else could you do?</p>'))});h+=card('<p>Compare the options. If someone is in danger, seek appropriate trusted or emergency help rather than intervening alone.</p>'+check('solutions','I explained my choices and suggested alternatives.'))}
if(m===5)D.chat.forEach((q,i)=>h+=card('<div class="phone"><p style="color:white">'+q[0]+' · Fictional chat</p><div class="bubble">'+esc(q[1])+'</div>'+(s.chat[i]===undefined?'':'<p class="reply">'+esc(q[2][s.chat[i]])+'</p>')+'</div><p>Choose the most supportive reply, then say another natural response.</p>'+quiz([q[1],q[2],q[3],q[4]],i,'chat')));
if(m===6)h+=card('<h3>Community action plan</h3><p>Choose a fictional issue: school supplies, loneliness, food donations or a community clean-up. Plan a small, safe action with a local organization.</p><div class="prompt">The problem is… / I feel concerned because… / We could… / We need… / Our first step is…</div>'+note('create','Write 4–6 sentences and present your plan.')+check('create','I presented my plan and answered a follow-up question.'));
if(m===7)h+=card('<h3>60–90 second speaking quest</h3><p>Describe a fictional community problem neutrally, express a feeling, suggest two possible actions and ask a polite question. Use three vocabulary words.</p>'+check('final','I completed the speaking challenge.')+'<h3>Reflection</h3><p>Which phrase will help you in real conversations? What do you want to practice again?</p>'+note('reflect','My reflection…')+check('reflect','I reflected on my learning.')+'<h3>Final results</h3><p>'+s.done.length+'/8 missions · '+s.done.length*50+'/400 XP · '+s.skip.length+' skipped</p><p>Vocabulary '+s.seen.length+'/6 · Listening '+D.listen.filter((q,i)=>s.a[i]===q[3]).length+'/8 · Grammar '+D.grammar.filter((q,i)=>s.g[i]===q[2]).length+'/6 · Chat '+D.chat.filter((q,i)=>s.chat[i]===q[3]).length+'/4</p><button onclick="report()">Copy results</button>');
h+=card('<div class="row"><button onclick="go(Math.max(0,s.m-1))">Previous</button><button id="complete" class="primary" onclick="complete()">'+(s.done.includes(m)?'Completed ✓':'Complete +50 XP')+'</button><button onclick="skip()">Skip mission</button><button onclick="go(Math.min(7,s.m+1))" '+(m===7?'disabled':'')+'>Next mission</button></div>');$('content').innerHTML=h;buttons();if(m===2)player()}function report(){navigator.clipboard.writeText('Education With Archie | Real Problems, Real Conversations\n'+s.done.length+'/8 missions | '+s.done.length*50+' XP\nPlan: '+(s.notes.create||'')+'\nReflection: '+(s.notes.reflect||'')).catch(()=>alert('Copy unavailable; select results manually.'))}function reset(){if(confirm('Reset progress?')){s=fresh();draw()}}render();
</script></body></html>
