<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Everyday Life Challenge | B1</title><style>*{box-sizing:border-box}body{margin:0;background:#F5F2EF;color:#22242D;font:16px/1.55 'DejaVu Sans',Arial,sans-serif}header{background:#22242D;color:white;padding:25px 5vw}header small{color:#d6a98b;letter-spacing:2px}h1{margin:8px 0;font-size:clamp(26px,5vw,46px)}h2{margin:0 0 10px}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #B98562;border-radius:9px;padding:10px 14px;background:white;color:#22242D}button:hover{background:#F5F2EF}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #B98562}button:disabled{opacity:.5;cursor:default}.primary,.active{background:#22242D;color:white}.primary:hover,.active:hover{background:#64616A}.layout{display:flex;max-width:1400px;margin:auto;gap:18px;padding:18px}aside{width:260px;flex-shrink:0}aside.closed{width:55px}aside.closed #nav,aside.closed .sideinfo{display:none}#nav button{display:block;width:100%;text-align:left;margin:7px 0}main{min-width:0;flex:1}.card{background:white;border:1px solid #dfd8d1;border-radius:16px;padding:clamp(14px,3vw,30px);margin-bottom:16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.score{background:#fff;border-radius:10px;padding:12px;margin:10px 0}.bar{height:10px;background:#ded7d1;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#B98562}.scene{background:#F5F2EF;border-radius:14px;text-align:center;padding:20px;font-size:clamp(40px,9vw,90px);letter-spacing:8px}.option{display:block;width:100%;text-align:left;margin:8px 0}.correct{border:2px solid #22242D;background:#e4dad2}.wrong{border:2px dashed #64616A}.muted{color:#64616A}textarea{width:100%;min-height:100px;padding:12px;border:1px solid #B98562;border-radius:8px}input{max-width:100%;padding:8px;border:1px solid #B98562;border-radius:8px}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}a{color:#22242D}footer{text-align:center;padding:20px;color:#64616A;font-size:12px}@media(max-width:700px){.layout{display:block;padding:10px}aside,aside.closed{width:100%;margin-bottom:12px}#nav{display:grid;grid-template-columns:1fr 1fr;gap:5px}#nav button{margin:0;font-size:13px}}.memory{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.memory button{min-height:90px;font-size:14px;overflow-wrap:anywhere}.tiles{display:flex;flex-wrap:wrap;gap:8px;background:#F5F2EF;padding:12px;min-height:65px;border-radius:10px}.phone{max-width:350px;margin:auto;background:#22242D;border:7px solid #22242D;border-radius:24px;overflow:hidden}.phone h3{color:white;padding:12px;margin:0}.chat{background:#F5F2EF;padding:20px}.bubble{background:white;border-radius:0 12px 12px 12px;padding:12px;margin:8px 20px 8px 0}.reply{background:#B98562;margin-left:20px;margin-right:0}.scene{letter-spacing:0}</style></head><body><header><small>EDUCATION WITH ARCHIE · TEEN QUEST · B1 · SOLO</small><h1>The Everyday Life Challenge</h1><p>Eight games. One player. Real English.</p></header><div class="layout"><aside id="side"><button id="toggle" onclick="s.closed=!s.closed;draw()"></button><div class="sideinfo"><input id="student" placeholder="Your name" aria-label="Your name" oninput="s.name=this.value;save()"><div id="progress"></div><button onclick="reset()">Reset progress</button></div><nav id="nav"></nav></aside><main id="content"></main></div><footer>EDUCATION WITH ARCHIE · ANYBODY CAN SPEAK ENGLISH, YOU JUST DON'T KNOW YET.</footer><script>const names=["Picture Detective","Memory Catch","Word Factory","English Auction","Choose Your Day","Listening Detective","Reply to the Chat","Final Boss"];
const pics=[["🏃 🎒 🚌 ⏰","She is rushing to catch the bus.","She is relaxing at home.","She has finished school."],["📚 📱 😵","He is distracted while studying.","He is sleeping peacefully.","He is cooking dinner."],["🛋️ 😴 🌙","He is exhausted after a long day.","He is preparing for a race.","He is getting on a bus."],["📅 ✅ 📝","She is planning a productive week.","She is ignoring her schedule.","She is watching a film."],["🌧️ 🧺 😞","He is disappointed about the cancelled picnic.","He is enjoying sunny weather.","He is swimming."],["🧹 👕 🏠","She is tidying her messy room.","She is leaving for school.","She is buying a ticket."]];
const words=[["overwhelmed","having too much to deal with","sobrecarregado"],["distracted","unable to focus","distraído"],["productive","getting useful things done","produtivo"],["exhausted","extremely tired","exausto"],["reliable","someone you can depend on","confiável"],["flexible","able to adapt to changes","flexível"]];
const sentences=["I usually feel exhausted after school","She is getting ready for an exam","I have been more productive this week","We changed our plans because it was raining","If I finish early I will call you","He gets distracted whenever his phone rings"];
const auction=[["She usually goes to bed early.",true],["I am agree with you.",false],["I have been busy lately.",true],["He doesn't likes school.",false],["If it rains we will stay home.",true],["I look forward to see you.",false]];
const story=[["You overslept and school starts soon.",["Get ready and notify your teacher.","Watch videos in bed.","Ignore school."],["You take responsibility.","You miss the bus.","Your absence causes concern."]],["A friend needs help but you have a test.",["Offer to help after your test.","Do their entire assignment.","Insult them."],["You protect your time and offer help.","You lose study time.","Your friend feels hurt."]],["Rain cancels your picnic.",["Suggest an indoor activity.","Complain all day.","Ignore the weather."],["You adapt to the situation.","You stay disappointed.","Your plan may be impractical."]]];
const chats=[["Mia · 08:15","Sorry, I'm running late. My bus hasn't arrived.","No worries! Let me know when you're close.","You never have a bus.","I was late tomorrow."],["Leo · 12:30","I'm overwhelmed with our project. Can you help with the slides?","Sure, after I finish my part.","Do it yourself, idiot.","I help yesterday."],["Mom · 16:05","Could you pick up some bread on your way home?","Of course. I'll stop at the bakery.","I am bread.","I bought tomorrow."],["Sam · 17:20","Something came up. I can't make it tonight.","That's okay. Shall we reschedule?","You must come yesterday.","I don't care."],["Ava · 18:40","I got a bad grade even though I studied a lot.","I'm sorry to hear that. Want to talk?","Congratulations!","You are a bad student."],["Ben · 20:00","I'm trying to spend less time on my phone. Any tips?","Maybe turn off notifications while studying.","You should to use more apps.","I am not phone."]];
const listen=[["When does Alex wake up?","5:30","7:30","8:00"],["What does he open after getting up?","The blinds","His laptop","The fridge"],["What does he put on in the kitchen?","The kettle","The TV","The washing machine"],["What does he drink with breakfast?","Tea or coffee","Only juice","Only milk"]];
const boss=[["Too many tasks? I feel…","overwhelmed","reliable","flexible"],["Choose the correct sentence.","She has been busy lately.","She have been busy lately.","She is busy yesterday."],["Your friend cancels plans.","No problem. Let's find another day.","You must come yesterday.","I am cancel."],["Choose a future consequence.","If I finish early, I'll call you.","I usually study.","I studied yesterday."]];
const $=x=>document.getElementById(x),key='archie-solo-b1-v1',shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fresh=()=>({m:0,done:[],skip:[],score:0,a:{},tries:{},deck:shuffle(words.flatMap((w,i)=>[{id:i,t:w[0]},{id:i,t:w[1]}])),matched:[],flip:[],moves:0,orders:sentences.map(x=>shuffle(x.split(' '))),w:0,tiles:[],cash:500,bid:50,notes:'',name:'',speak:false,closed:false});let s=fresh();try{s={...s,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}s.flip=[];function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}function draw(){save();render()}function go(i){s.m=i;draw();scrollTo(0,0)}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ans(k,j,a){if(s.a[k]===a)return;s.tries[k]=(s.tries[k]||0)+1;s.a[k]=j;if(j===a&&s.tries[k]===1)s.score+=10;draw()}
function quiz(k,opts,i,why){let a=i%3,arr=[...opts];for(let j=0;j<a;j++)arr.unshift(arr.pop());return arr.map((v,j)=>'<button class="option '+(s.a[k]===j?(j===a?'correct':'wrong'):'')+'" '+(s.a[k]===a?'disabled':'')+' onclick="ans(\''+k+'\','+j+','+a+')">'+esc(v)+'</button>').join('')+(s.a[k]===undefined?'':'<p>'+ (s.a[k]===a?'Correct! '+why:'Try again. Consider the context and grammar.')+'</p>')}
function flip(i){if(s.flip.length===2||s.flip.includes(i)||s.matched.includes(i))return;s.flip.push(i);if(s.flip.length===2){s.moves++;let [a,b]=s.flip;if(s.deck[a].id===s.deck[b].id){s.matched.push(a,b);s.score+=10;s.flip=[]}else{draw();setTimeout(()=>{s.flip=[];draw()},850);return}}draw()}
function checkWord(){let k='w'+s.w;if(s.a[k]===1)return;ans(k,s.tiles.map(i=>s.orders[s.w][i]).join(' ')===sentences[s.w]?1:0,1)}
function bid(i,v){let k='a'+i;if(s.a[k]!==undefined||s.cash<s.bid)return;let ok=v===auction[i][1];s.a[k]=ok?1:0;s.cash+=ok?s.bid:-s.bid;if(ok)s.score+=10;draw()}
function decide(i,j){if(s.a['d'+i]!==undefined)return;s.a['d'+i]=j;if(j===0)s.score+=10;draw()}
function all(arr,p){return arr.every((_,i)=>s.a[p+i]===i%3)}function ready(){return [()=>all(pics,'p'),()=>s.matched.length===12,()=>sentences.every((_,i)=>s.a['w'+i]===1),()=>auction.every((_,i)=>s.a['a'+i]!==undefined)||s.cash===0,()=>story.every((_,i)=>s.a['d'+i]!==undefined),()=>all(listen,'l'),()=>all(chats,'c'),()=>all(boss,'b')&&s.speak][s.m]()}
function complete(){if(ready()&&!s.done.includes(s.m)){s.done.push(s.m);s.skip=s.skip.filter(i=>i!==s.m)}draw()}function skip(){if(!s.done.includes(s.m)&&!s.skip.includes(s.m))s.skip.push(s.m);go(Math.min(7,s.m+1))}
const card=x=>'<section class="card">'+x+'</section>';function render(){let m=s.m;$('side').classList.toggle('closed',s.closed);$('toggle').textContent=s.closed?'☰':'Collapse ☰';$('nav').innerHTML=names.map((n,i)=>'<button class="'+(m===i?'active':'')+'" onclick="go('+i+')">'+(s.done.includes(i)?'✓ ':s.skip.includes(i)?'↷ ':'')+(i+1)+' · '+n+'</button>').join('');$('progress').innerHTML='<b>'+s.done.length+'/8 games · '+s.done.length*50+'/400 XP</b><div class="bar"><span style="width:'+s.done.length*12.5+'%"></span></div><h2>'+s.score+' points</h2><small>First-try answers: +10 points. Completed games: +50 XP.</small>';let h=card('<small>SOLO · GAME '+(m+1)+'/8</small><h2>'+names[m]+'</h2>');
if(m===0)pics.forEach((q,i)=>h+=card('<div class="scene" role="img" aria-label="Visual clue '+(i+1)+'">'+q[0]+'</div><p>Choose the best description and explain why aloud.</p>'+quiz('p'+i,q.slice(1),i,'The sentence fits the visual clues.')));
if(m===1)h+=card('<p>Match six adjectives to their definitions. Give an example after each pair.</p><p>'+s.matched.length/2+'/6 pairs · '+s.moves+' attempts</p><div class="memory">'+s.deck.map((c,i)=>'<button class="'+(s.matched.includes(i)?'correct':s.flip.includes(i)?'':'primary')+'" onclick="flip('+i+')" '+(s.matched.includes(i)?'disabled':'')+'>'+(s.matched.includes(i)||s.flip.includes(i)?esc(c.t):'?')+'</button>').join('')+'</div>')+card('<h3>Vocabulary reference</h3>'+words.map(w=>'<details><summary>'+w[0]+'</summary>'+w[1]+' · '+w[2]+'</details>').join(''));
if(m===2){let i=s.w;h+=card('<p>Sentence '+(i+1)+'/6. Tap tiles in order; tap selected tiles to remove them.</p><div class="tiles">'+s.tiles.map((j,k)=>'<button onclick="s.tiles.splice('+k+',1);draw()">'+esc(s.orders[i][j])+'</button>').join('')+'</div><div class="tiles">'+s.orders[i].map((w,j)=>'<button '+(s.tiles.includes(j)?'disabled':'')+' onclick="s.tiles.push('+j+');draw()">'+esc(w)+'</button>').join('')+'</div><div class="row"><button onclick="checkWord()" '+(s.tiles.length!==s.orders[i].length?'disabled':'')+'>Check</button><button onclick="s.tiles=[];draw()">Clear</button><button onclick="s.w=Math.max(0,s.w-1);s.tiles=[];draw()">Previous</button><button onclick="s.w=Math.min(5,s.w+1);s.tiles=[];draw()">Next</button></div><p>'+(s.a['w'+i]===1?'Correct! '+sentences[i]:s.a['w'+i]===0?'Try again. Check word order.':'')+'</p>')}
if(m===3){h+=card('<p>Stake virtual money on whether a sentence is correct. Win or lose your stake.</p><h2>$'+s.cash+'</h2><button onclick="s.bid=50;draw()">$50</button> <button onclick="s.bid=100;draw()">$100</button> Selected: $'+s.bid);auction.forEach((q,i)=>h+=card('<h3>'+q[0]+'</h3>'+(s.a['a'+i]===undefined?'<button onclick="bid('+i+',true)" '+(s.cash<s.bid?'disabled':'')+'>Correct</button> <button onclick="bid('+i+',false)" '+(s.cash<s.bid?'disabled':'')+'>Incorrect</button>':'<p>'+(s.a['a'+i]?'You won! ':'You lost your stake. ')+['Usually + present simple.','Say I agree with you.','Present perfect for recent states.','Use like after doesn’t.','First conditional.','Use looking forward to seeing you.'][i]+'</p>')))}
if(m===4)story.forEach((q,i)=>{if(i>0&&s.a['d'+(i-1)]===undefined)return;let a=s.a['d'+i];h+=card('<h3>'+q[0]+'</h3>'+q[1].map((v,j)=>'<button class="option '+(a===j?'active':'')+'" '+(a!==undefined?'disabled':'')+' onclick="decide('+i+','+j+')">'+v+'</button>').join('')+(a!==undefined?'<p>'+q[2][a]+' Explain your choice aloud.</p>':''))});
if(m===5){h+=card('<p>Watch 0:13–6:30 twice. Compare the speaker’s routine with yours using whereas and however.</p><iframe title="Daily routine video" src="https://www.youtube-nocookie.com/embed/pX91MG83Etc?start=13&end=390" allowfullscreen></iframe><a href="https://www.youtube.com/watch?v=pX91MG83Etc&t=13s" target="_blank" rel="noopener">Open on YouTube</a>');listen.forEach((q,i)=>h+=card('<h3>'+q[0]+'</h3>'+quiz('l'+i,q.slice(1),i,'Listen again to confirm.')))}
if(m===6)chats.forEach((q,i)=>{let a=s.a['c'+i],opts=q.slice(2);for(let j=0;j<i%3;j++)opts.unshift(opts.pop());h+=card('<div class="phone"><h3>● '+q[0]+'</h3><div class="chat"><div class="bubble">'+q[1]+'</div>'+(a===undefined?'':'<div class="bubble reply">'+opts[a]+'</div>')+'</div></div><p>Choose the most natural and appropriate reply. Say another possible reply aloud.</p>'+quiz('c'+i,q.slice(2),i,['Acknowledge the delay.','Offer realistic help.','Confirm the request.','Show understanding and reschedule.','Respond with empathy.','Offer practical advice.'][i]))});
if(m===7){let hp=100-boss.filter((_,i)=>s.a['b'+i]===i%3).length*20-(s.speak?20:0);h+=card('<h3>English Guardian · '+hp+' HP</h3><div class="bar"><span style="width:'+hp+'%"></span></div><p>'+(hp===0?'Victory!':'Each correct challenge deals 20 damage.')+'</p>');boss.forEach((q,i)=>h+=card('<h3>'+q[0]+'</h3>'+quiz('b'+i,q.slice(1),i,'Excellent!')));h+=card('<h3>Final speaking task</h3><p>Speak for 60 seconds about a busy day and a change of plans. Use three adjectives and a conditional.</p><textarea id="notes" oninput="s.notes=this.value;save()">'+esc(s.notes)+'</textarea><label><input type="checkbox" '+(s.speak?'checked':'')+' onchange="s.speak=this.checked;draw()"> Speaking completed</label><h3>Final results</h3><p>'+s.score+' points · '+s.done.length+'/8 games · '+s.done.length*50+' XP · '+s.skip.length+' skipped</p><p>Memory attempts: '+s.moves+' · Auction balance: $'+s.cash+'</p><button onclick="copyReport()">Copy results and notes</button>')}
h+=card('<div class="row"><button onclick="go(Math.max(0,s.m-1))">Previous</button><button class="primary" onclick="complete()" '+(!ready()||s.done.includes(m)?'disabled':'')+'>'+(s.done.includes(m)?'Completed ✓':'Complete +50 XP')+'</button><button onclick="skip()">Skip game</button><button onclick="go(Math.min(7,s.m+1))" '+(m===7?'disabled':'')+'>Next</button></div>');$('content').innerHTML=h}
function copyReport(){navigator.clipboard.writeText('Education With Archie | B1 Solo\n'+s.name+'\nPoints: '+s.score+' | XP: '+s.done.length*50+' | Completed: '+s.done.length+'/8 | Skipped: '+s.skip.length+'\nMemory attempts: '+s.moves+' | Auction: $'+s.cash+'\n'+s.notes).catch(()=>alert('Copy unavailable. Select results manually.'))}function reset(){if(confirm('Reset all progress?')){s=fresh();$('student').value='';draw()}}$('student').value=s.name;render();
</script></body></html>
