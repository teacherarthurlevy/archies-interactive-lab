<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Daily Life Games | Education With Archie</title><style>*{box-sizing:border-box}body{margin:0;background:#F5F2EF;color:#22242D;font:16px/1.55 'DejaVu Sans',Arial,sans-serif}header{background:#22242D;color:white;padding:25px 5vw}header small{color:#d6a98b;letter-spacing:2px}h1{margin:8px 0;font-size:clamp(26px,5vw,46px)}h2{margin:0 0 10px}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #B98562;border-radius:9px;padding:10px 14px;background:white;color:#22242D}button:hover{background:#F5F2EF}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #B98562}button:disabled{opacity:.5;cursor:default}.primary,.active{background:#22242D;color:white}.primary:hover,.active:hover{background:#64616A}.layout{display:flex;max-width:1400px;margin:auto;gap:18px;padding:18px}aside{width:260px;flex-shrink:0}aside.closed{width:55px}aside.closed #nav,aside.closed .sideinfo{display:none}#nav button{display:block;width:100%;text-align:left;margin:7px 0}main{min-width:0;flex:1}.card{background:white;border:1px solid #dfd8d1;border-radius:16px;padding:clamp(14px,3vw,30px);margin-bottom:16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.score{background:#fff;border-radius:10px;padding:12px;margin:10px 0}.bar{height:10px;background:#ded7d1;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#B98562}.scene{background:#F5F2EF;border-radius:14px;text-align:center;padding:20px;font-size:clamp(40px,9vw,90px);letter-spacing:8px}.option{display:block;width:100%;text-align:left;margin:8px 0}.correct{border:2px solid #22242D;background:#e4dad2}.wrong{border:2px dashed #64616A}.muted{color:#64616A}textarea{width:100%;min-height:100px;padding:12px;border:1px solid #B98562;border-radius:8px}input{max-width:100%;padding:8px;border:1px solid #B98562;border-radius:8px}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}a{color:#22242D}footer{text-align:center;padding:20px;color:#64616A;font-size:12px}@media(max-width:700px){.layout{display:block;padding:10px}aside,aside.closed{width:100%;margin-bottom:12px}#nav{display:grid;grid-template-columns:1fr 1fr;gap:5px}#nav button{margin:0;font-size:13px}}</style></head><body><header><small>EDUCATION WITH ARCHIE · TEEN QUEST · A2</small><h1>The Daily Life Games</h1><div>Eight games. Everyday English. One championship.</div></header><div class="layout"><aside id="side"><button id="toggle" onclick="s.collapsed=!s.collapsed;save();render()"></button><div class="sideinfo"><div id="progress"></div><div id="team"></div><button onclick="reset()">Reset tournament</button></div><nav id="nav" aria-label="Games"></nav></aside><main id="content"></main></div><footer>EDUCATION WITH ARCHIE · ANYBODY CAN SPEAK ENGLISH, YOU JUST DON'T KNOW YET.</footer><script>
const games=[["Picture Detective","Look at each scene. Choose the best sentence.",[["🏃‍♀️ 🎒 🚌","She is running to catch the bus.","She is sleeping.","She is cooking.",0,"She is running: an action happening now."],["😴 🛏️ 🌙","He is doing homework.","He is sleeping in bed.","He is playing football.",1,"The bed and moon show bedtime."],["👩‍🍳 🍳 🍞","She is brushing her teeth.","She is washing her car.","She is making breakfast.",2,"The food and pan show cooking."],["🧑‍💻 📚 😫","He looks tired and is studying.","He is swimming.","He looks relaxed at the beach.",0,"The books and expression suggest studying and tiredness."],["🧘 🌳 ☀️","She is taking an exam.","She is relaxing outside.","She is getting dressed.",1,"The seated pose and park suggest relaxation."],["🧹 🪣 🏠","He is eating lunch.","He is catching a train.","He is cleaning the house.",2,"The broom and bucket indicate cleaning."]]],["Vocabulary Rush","Reveal six adjective cards, then give a personal example.",[]],["Routine Builder","Choose the most logical next step in this fictional school-day routine.",[["I wake up. What comes next?","Go to bed","Get dressed","Finish school",1,"Getting dressed belongs to the morning."],["I get dressed and eat breakfast. Next?","Go to school","Go to sleep","Eat dinner",0,"School follows breakfast in this routine."],["School finishes at 3 p.m. Next?","Wake up","Have breakfast","Go home",2,"Going home follows school."],["I finish dinner. It is almost bedtime. Next?","Catch the morning bus","Brush my teeth","Start school",1,"Brushing teeth is a bedtime habit."]]],["Adjective Battle","Choose the adjective that fits the situation.",[["I have five classes, homework and football practice.","Quiet","Busy","Relaxed",1,"Busy means having many things to do."],["I slept only four hours.","Tired","Early","Organized",0,"Tired means needing rest."],["I have no homework and I am enjoying music.","Late","Busy","Relaxed",2,"Relaxed means calm and comfortable."],["My class starts at 8. I arrive at 7:45.","Early","Late","Tired",0,"Early means before the expected time."],["My class starts at 8. I arrive at 8:15.","Organized","Late","Early",1,"Late means after the expected time."],["My books and school plans are ready for tomorrow.","Tired","Late","Organized",2,"Organized means prepared and in order."]]],["Grammar Showdown","Habits or actions happening now?",[["Every morning, she ___ breakfast.","is eating","eats","eat",1,"Use present simple for habits."],["Look! They ___ football.","are playing","plays","play every day",0,"Use present continuous for actions now."],["He usually ___ to school.","walk","is walking","walks",2,"He/she/it takes -s in present simple."],["Right now, I ___ my homework.","do usually","am doing","does",1,"Am + verb-ing describes now."],["We ___ tired after school every day.","are","is","am",0,"We are describes a regular state."],["Listen! Mia ___ a song.","sing","sings every Monday","is singing",2,"Listen indicates an action happening now."]]],["Listening Detective","Watch 0:13–6:30 of the video twice. First listen for the main idea, then answer.",[["When does Alex wake up?","5:30","7:30","8:00",0,"0:13–2:49: He says he wakes at 5:30."],["Does he leave bed immediately?","Yes","No","He never gets up",1,"0:13–2:49: He stays in bed for a while."],["What does he open after getting up?","His laptop","The fridge","The blinds",2,"0:13–2:49: He opens the blinds."],["What does he put on in the kitchen?","The kettle","The television","The washing machine",0,"2:49–6:30: He prepares hot water."],["What does he drink with breakfast?","Orange juice only","Tea or coffee","Milk only",1,"2:49–6:30: He mentions tea or coffee."],["What else does he do during breakfast?","Plays football","Reads a school book","Checks his phone",2,"2:49–6:30: He checks his phone."]]],["Guess My Routine","One player describes a secret activity without saying its name. The other team guesses in English.",[]],["The Final Boss","Mixed challenge: answer, then describe your own day.",[["It is 11 p.m. I need to sleep. I feel ___.","early","tired","organized",1,"Tired is the best description."],["My sister ___ her teeth every morning.","brushes","brush","is brush",0,"Use brushes for a regular habit."],["Look at Dad! He ___ dinner.","cook","cooks every day","is cooking",2,"Look signals an action now."],["I have a test at 9. I arrive at 8:40. I am ___.","late","early","busy",1,"You arrived before the test."],["Which sentence describes a habit?","I usually read before bed.","I am reading now.","I am putting on my shoes now.",0,"Usually signals a routine."]]]];
const words=[['busy','ocupado','having many things to do','My Mondays are busy.'],['tired','cansado','needing rest','I feel tired after school.'],['relaxed','relaxado','calm and comfortable','I feel relaxed on Sundays.'],['early','cedo / adiantado','before the expected time','I arrive early for class.'],['late','atrasado / tarde','after the expected time','I am late for school.'],['organized','organizado','prepared and in order','My sister is very organized.']];
const secrets=['brush your teeth','catch the bus','do homework','make breakfast','walk the dog','clean your room','play video games','get dressed'];
const key='archie-daily-life-games-v1';const fresh=()=>({m:0,done:[],skip:[],answers:{},attempts:{},card:0,revealed:false,seen:[],teams:['Team A','Team B'],scores:[0,0],team:0,mode:'team',secret:0,guess:false,awarded:{},notes:'',collapsed:false});let s=fresh();try{const old=localStorage.getItem(key);if(old)s={...s,...JSON.parse(old)}}catch(e){};const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(n){s.m=n;save();render();window.scrollTo(0,0)}function points(k,n){if(!s.awarded[k]){s.awarded[k]=true;s.scores[s.team]+=n}}function answer(i,j){const k=s.m+'-'+i,q=games[s.m][2][i];if(s.answers[k]!==undefined)return;s.attempts[k]=(s.attempts[k]||0)+1;if(j===q[4]){s.answers[k]=j;if(s.attempts[k]===1)points(k,10)}else{s.answers[k]=-1}save();render()}function retry(i){delete s.answers[s.m+'-'+i];save();render()}function complete(){if(!s.done.includes(s.m)){s.done.push(s.m);s.skip=s.skip.filter(x=>x!==s.m)}save();render()}function skip(){if(!s.done.includes(s.m)&&!s.skip.includes(s.m))s.skip.push(s.m);go(Math.min(7,s.m+1))}function cardMove(n){s.card=(s.card+n+6)%6;s.revealed=false;save();render()}function showWord(){s.revealed=!s.revealed;if(s.revealed&&!s.seen.includes(s.card))s.seen.push(s.card);save();render()}function guessAward(){points('guess-'+s.secret,10);s.guess=false;save();render()}function nextSecret(){s.secret=(s.secret+1)%secrets.length;s.guess=false;save();render()}function render(){const m=s.m,g=games[m];$('side').classList.toggle('closed',s.collapsed);$('toggle').textContent=s.collapsed?'☰':'Collapse ☰';$('nav').innerHTML=games.map((a,i)=>'<button class="'+(i===m?'active':'')+'" onclick="go('+i+')">'+(s.done.includes(i)?'✓ ':s.skip.includes(i)?'↷ ':'')+(i+1)+' · '+a[0]+'</button>').join('');$('progress').innerHTML='<b>'+s.done.length+'/8 games · '+s.done.length*50+'/400 XP</b><div class="bar"><span style="width:'+s.done.length*12.5+'%"></span></div>'; $('team').innerHTML='<div class="row"><button class="'+(s.mode==='solo'?'active':'')+'" onclick="mode(\'solo\')">Solo</button><button class="'+(s.mode==='team'?'active':'')+'" onclick="mode(\'team\')">Teams</button></div>'+[0,1].filter(i=>s.mode==='team'||i===0).map(i=>'<div class="score"><input aria-label="Team name" value="'+esc(s.teams[i])+'" onchange="rename('+i+',this.value)"><b> '+s.scores[i]+' pts</b> <button class="'+(s.team===i?'active':'')+'" onclick="selectTeam('+i+')">'+(s.team===i?'Playing':'Select')+'</button></div>').join('')+'<small>First-attempt correct answers earn 10 points. Switch teams before a question. Game completion earns shared XP.</small>';
let h='<section class="card"><small class="muted">GAME '+(m+1)+' / 8</small><h2>'+g[0]+'</h2><p>'+g[1]+'</p>';
if(m===0)h+='<p class="muted">Observe the illustrated emoji scenes. Say a full sentence before choosing.</p>';
if(m===5)h+='<iframe title="Daily routine listening video" src="https://www.youtube-nocookie.com/embed/pX91MG83Etc?start=13&end=390" allowfullscreen></iframe><p><a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=pX91MG83Etc&t=13s">Open video on YouTube if playback fails</a> · English with Alex / engVid · A2 beginner lesson. Pause at 6:30.</p>';
if(m===1){const w=words[s.card];h+='<div class="scene" style="font-size:30px;letter-spacing:0">'+w[0]+'</div><p>Card '+(s.card+1)+' / 6 · '+s.seen.length+' revealed</p>'+(s.revealed?'<p><b>'+w[1]+'</b> · '+w[2]+'</p><p>'+w[3]+'</p>':'<p>What does this word mean?</p>')+'<div class="row"><button onclick="cardMove(-1)">Previous</button><button class="primary" onclick="showWord()">Reveal / hide</button><button onclick="cardMove(1)">Next / skip card</button></div><p>Speak: When do you feel '+w[0]+'? Give a real example.</p>'}
if(m===6)h+='<div class="scene" style="font-size:28px;letter-spacing:0">'+(s.guess?secrets[s.secret]:'Secret activity #'+(s.secret+1))+'</div><p>Only the clue giver should look. Use: I usually do this in the morning… / I need…</p><div class="row"><button onclick="s.guess=!s.guess;save();render()">Reveal / hide secret</button><button onclick="guessAward()" '+(s.awarded['guess-'+s.secret]?'disabled':'')+'>Teacher: correct guess +10</button><button onclick="nextSecret()">Next activity</button></div><p>Solo: describe it aloud, then reveal and check.</p>';
h+='</section>';g[2].forEach((q,i)=>{let k=m+'-'+i,a=s.answers[k];h+='<section class="card"><small class="muted">ROUND '+(i+1)+'</small>'+(m===0?'<div class="scene" role="img" aria-label="Illustrated daily activity">'+q[0]+'</div>':'<h3>'+q[0]+'</h3>');for(let j=0;j<3;j++){h+='<button class="option '+(a===j?'correct':'')+'" '+(a!==undefined?'disabled':'')+' onclick="answer('+i+','+j+')">'+String.fromCharCode(65+j)+'. '+q[j+1]+'</button>'}if(a===-1)h+='<p role="status">Not quite. Think again — no first-attempt points on retry.</p><button onclick="retry('+i+')">Try again</button>';else if(a!==undefined)h+='<p role="status"><b>Correct!</b> '+q[5]+'</p>';h+='</section>'});
if(m===7)h+='<section class="card"><h3>Final speaking quest</h3><p>Describe your weekday in 6 sentences. Use three adjectives, two routine verbs and one action happening now. Compare your day with a partner.</p><textarea id="notes" placeholder="Write your ideas..." oninput="s.notes=this.value;save()">'+esc(s.notes)+'</textarea><button onclick="copyNotes()">Copy response</button><p>Teacher: check the speaking task before completing.</p><h3>Scoreboard</h3><p>'+esc(s.teams[0])+': '+s.scores[0]+' points'+(s.mode==='team'?' · '+esc(s.teams[1])+': '+s.scores[1]+' points':'')+'</p><p>Completed: '+s.done.length+'/8 · Skipped: '+s.skip.length+'</p></section>';
let ready=g[2].every((q,i)=>s.answers[m+'-'+i]===q[4])&&(m!==1||s.seen.length===6)&&(m!==6||secrets.some((_,i)=>s.awarded['guess-'+i]));h+='<section class="card row"><button onclick="go(Math.max(0,s.m-1))" '+(m===0?'disabled':'')+'>Previous game</button><button class="primary" onclick="complete()" '+(!ready||s.done.includes(m)?'disabled':'')+'>'+(s.done.includes(m)?'Completed ✓':'Complete +50 XP')+'</button><button onclick="skip()">Skip game</button><button onclick="go(Math.min(7,s.m+1))" '+(m===7?'disabled':'')+'>Next game</button></section>';$('content').innerHTML=h; }
function mode(v){s.mode=v;if(v==='solo')s.team=0;save();render()}function rename(i,v){s.teams[i]=v.trim()||'Team '+(i+1);save();render()}function selectTeam(i){s.team=i;save();render()}function copyNotes(){navigator.clipboard.writeText(s.notes).catch(()=>{$('notes').select();document.execCommand('copy')})}function reset(){if(confirm('Reset all scores and progress?')){s=fresh();save();render()}}render();
</script></body></html>
