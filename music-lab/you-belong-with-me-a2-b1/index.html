<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>You Belong With Me | Music Lab A2–B1</title><style>*{box-sizing:border-box}body{margin:0;background:#F5F2EF;color:#22242D;font:16px/1.55 'DejaVu Sans',Arial,sans-serif}header{background:#22242D;color:white;padding:25px 5vw}header small{color:#d6a98b;letter-spacing:2px}h1{margin:8px 0;font-size:clamp(26px,5vw,46px)}h2{margin:0 0 10px}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #B98562;border-radius:9px;padding:10px 14px;background:white;color:#22242D}button:hover{background:#F5F2EF}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #B98562}button:disabled{opacity:.5;cursor:default}.primary,.active{background:#22242D;color:white}.primary:hover,.active:hover{background:#64616A}.layout{display:flex;max-width:1400px;margin:auto;gap:18px;padding:18px}aside{width:260px;flex-shrink:0}aside.closed{width:55px}aside.closed #nav,aside.closed .sideinfo{display:none}#nav button{display:block;width:100%;text-align:left;margin:7px 0}main{min-width:0;flex:1}.card{background:white;border:1px solid #dfd8d1;border-radius:16px;padding:clamp(14px,3vw,30px);margin-bottom:16px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.score{background:#fff;border-radius:10px;padding:12px;margin:10px 0}.bar{height:10px;background:#ded7d1;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#B98562}.scene{background:#F5F2EF;border-radius:14px;text-align:center;padding:20px;font-size:clamp(40px,9vw,90px);letter-spacing:8px}.option{display:block;width:100%;text-align:left;margin:8px 0}.correct{border:2px solid #22242D;background:#e4dad2}.wrong{border:2px dashed #64616A}.muted{color:#64616A}textarea{width:100%;min-height:100px;padding:12px;border:1px solid #B98562;border-radius:8px}input{max-width:100%;padding:8px;border:1px solid #B98562;border-radius:8px}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}a{color:#22242D}footer{text-align:center;padding:20px;color:#64616A;font-size:12px}@media(max-width:700px){.layout{display:block;padding:10px}aside,aside.closed{width:100%;margin-bottom:12px}#nav{display:grid;grid-template-columns:1fr 1fr;gap:5px}#nav button{margin:0;font-size:13px}}.prompt{border-left:4px solid #B98562;padding:12px;background:#F5F2EF;margin:12px 0}.tag{font-size:12px;letter-spacing:1px;color:#64616A}.choice{margin:8px 0}.scene{font-size:30px;letter-spacing:0}.timer{font-weight:bold;color:#64616A}details{margin:10px 0}summary{cursor:pointer}label{display:block;margin:10px 0}</style></head><body><header><small>EDUCATION WITH ARCHIE · MUSIC LAB · A2–B1 · 60 MIN</small><h1>You Belong With Me</h1><p>Taylor Swift · Listen. Connect. Express yourself.</p></header><div class="layout"><aside id="side"><button id="toggle" onclick="s.closed=!s.closed;draw()"></button><div class="sideinfo"><div id="progress"></div><button onclick="reset()">Reset progress</button></div><nav id="nav" aria-label="Missions"></nav></aside><main id="content"></main></div><footer>EDUCATION WITH ARCHIE · ANYBODY CAN SPEAK ENGLISH, YOU JUST DON'T KNOW YET.</footer><script>const D={"names":["Before the Music","Words Behind the Story","Listen & Discover","The Story Detective","Grammar Through Music","Reply to the Chat","Rewrite the Story","Final Quest"],"times":[5,6,9,8,8,8,9,7],"words":[["belong","pertencer","feel accepted as part of a group","I feel like I belong here."],["notice","perceber","become aware of something","Did you notice her new haircut?"],["jealous","com ciúmes","unhappy because someone has something you want","He feels jealous when his friend spends time with someone else."],["confident","confiante","sure of yourself","She feels confident with her friends."],["misunderstand","entender errado","understand something incorrectly","Please explain so I don't misunderstand."],["supportive","que dá apoio","helpful and encouraging","My friends are supportive."]],"quiz":[["A friend who listens is often ___ than someone who ignores you.",["more supportive","supportiver","most supportive"],0,"Use more with longer adjectives."],["I feel ___ today than yesterday.",["happyer","happier","happiest"],1,"Change y to i before -er."],["She ___ nervous about the conversation.",["feel","feeling","feels"],2,"Use feels with she."],["My friend is ___ than me.",["more confident","confidenter","most confident"],0,"More confident is the comparative."],["You ___ tell your friend how you feel.",["should to","should","should telling"],1,"Should + base verb."],["I think friendship is ___ than popularity.",["important","most important","more important"],2,"Use more important than to compare."]],"chat":[["Alex · Friend","I like someone, but I'm afraid to tell them.",["Maybe talk to them honestly when you feel ready.","They have to like you back.","Ignore their feelings."],0,"Encourage respectful communication."],["Jamie · Friend","I feel jealous when my best friend hangs out with others.",["Stop them from seeing other people.","It's okay to feel that way. Try talking about it.","You should be angry forever."],1,"Acknowledge feelings without controlling others."],["Sam · Friend","Someone told me they like me, but I don't feel the same.",["Pretend you like them.","Tell everyone their secret.","Be kind and honest about your feelings."],2,"Respect both people's feelings."],["Mia · Friend","I think my friend misunderstood my message.",["Ask if you can explain what you meant.","Never speak to them again.","Send an angry message."],0,"Clarify the misunderstanding."]]};

const $=x=>document.getElementById(x),key='archie-music-belong-v1',fresh=()=>({m:0,done:[],skip:[],seen:[],c:0,rev:false,a:{},chat:{},checks:{},notes:{},closed:false});let s=fresh();try{s={...s,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}function draw(){save();render()}function go(i){s.m=i;draw();scrollTo(0,0)}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const card=x=>'<section class="card">'+x+'</section>';function check(k,t){return '<label><input type="checkbox" '+(s.checks[k]?'checked':'')+' onchange="s.checks[\''+k+'\']=this.checked;draw()"> '+t+'</label>'}function note(k,t){return '<textarea id="note-'+k+'" placeholder="'+esc(t)+'" oninput="s.notes[\''+k+'\']=this.value;save()">'+esc(s.notes[k])+'</textarea><button onclick="copy(\''+k+'\')">Copy response</button>'}function copy(k){let t=$('note-'+k);navigator.clipboard.writeText(t.value).catch(()=>{t.select();document.execCommand('copy')})}function move(n){s.c=(s.c+n+6)%6;s.rev=false;draw()}function reveal(){s.rev=!s.rev;if(s.rev&&!s.seen.includes(s.c))s.seen.push(s.c);draw()}function quiz(q,i,k){let a=s[k][i],opts=q[1],correct=q[2];return opts.map((v,j)=>'<button class="option '+(a===j?(j===correct?'correct':'wrong'):'')+'" '+(a===correct?'disabled':'')+' onclick="s.'+k+'['+i+']='+j+';draw()">'+esc(v)+'</button>').join('')+(a===undefined?'':'<p>'+(a===correct?'Correct! ':'Try again. ')+q[3]+'</p>')}function ready(){return [()=>s.checks.warm,()=>s.seen.length===6,()=>s.checks.listen&&!!(s.notes.listen||'').trim(),()=>s.checks.story,()=>D.quiz.every((q,i)=>s.a[i]===q[2]),()=>D.chat.every((q,i)=>s.chat[i]===q[3]),()=>s.checks.create&&!!(s.notes.create||'').trim(),()=>s.checks.final&&s.checks.reflect][s.m]()}function complete(){if(ready()&&!s.done.includes(s.m)){s.done.push(s.m);s.skip=s.skip.filter(i=>i!==s.m)}draw()}function skip(){if(!s.done.includes(s.m)&&!s.skip.includes(s.m))s.skip.push(s.m);go(Math.min(7,s.m+1))}
function render(){let m=s.m;$('side').classList.toggle('closed',s.closed);$('toggle').textContent=s.closed?'☰':'Collapse ☰';$('nav').innerHTML=D.names.map((n,i)=>'<button class="'+(m===i?'active':'')+'" onclick="go('+i+')">'+(s.done.includes(i)?'✓ ':s.skip.includes(i)?'↷ ':'')+(i+1)+' · '+n+'</button>').join('');$('progress').innerHTML='<b>'+s.done.length+'/8 · '+s.done.length*50+'/400 XP</b><div class="bar"><span style="width:'+s.done.length*12.5+'%"></span></div>';let h=card('<small>MISSION '+(m+1)+' · '+D.times[m]+' MIN</small><h2>'+D.names[m]+'</h2>');
if(m===0)h+=card('<h3>Talk before listening</h3><p>What kind of music do you enjoy? When do you listen to music?</p><p>What makes someone a good friend?</p><p>Is it easy to tell someone how you feel?</p><p>What does the title You Belong With Me suggest to you?</p><details><summary>Useful starters</summary>I usually listen to… / A good friend is… / I think the title means…</details>'+check('warm','I discussed the questions.'));
if(m===1){let w=D.words[s.c];h+=card('<div class="scene" style="font-size:32px;letter-spacing:0">'+w[0]+'</div><p>Card '+(s.c+1)+'/6 · '+s.seen.length+' discovered</p>'+(s.rev?'<p><b>'+w[1]+'</b> · '+w[2]+'</p><p>'+w[3]+'</p>':'<p>Guess the meaning.</p>')+'<div class="row"><button onclick="move(-1)">Previous</button><button onclick="reveal()">Reveal / hide</button><button onclick="move(1)">Next / skip</button></div><p>Speak: Make your own sentence using this word.</p>')}
if(m===2)h+=card('<iframe title="You Belong With Me — supplied YouTube video" src="https://www.youtube-nocookie.com/embed/yA3jAcbIzHM" allowfullscreen></iframe><p><a href="https://www.youtube.com/watch?v=yA3jAcbIzHM" target="_blank" rel="noopener">Open original video on YouTube</a></p><h3>First listen: main idea</h3><p>What is the main emotion? What relationship does the singer describe? What does she wish would happen?</p><h3>Second listen: evidence</h3><p>Listen for a comparison between people, a description of feelings and an everyday situation. Explain each in your own words. Do not copy lyrics.</p>'+note('listen','My observations and evidence in my own words…')+'<details><summary>Teacher guide · suggested interpretation</summary>The narrator wants someone she cares about to recognize their connection. She contrasts herself with another person and expresses longing. Accept other interpretations supported by the recording.</details>'+check('listen','I listened twice and explained my observations.'));
if(m===3)h+=card('<p>Consider the narrator, the person she likes and the other person in the story.</p><h3>Detective questions</h3><p>How does the narrator feel? What makes you think that?</p><p>How does she compare herself with someone else?</p><p>Do we know what the other people really think, or only what the narrator thinks?</p><p>Does caring about someone mean they must feel the same way? Why?</p><p>If your video includes a story on screen, describe one scene you noticed. If it is audio-only, imagine a scene that fits the story.</p>'+note('story','Describe the characters and their feelings…')+check('story','I explained my interpretation aloud.'));
if(m===4){h+=card('<h3>Comparatives & feelings</h3><p>happy → happier · confident → more confident · good → better</p><p>I feel nervous. / She feels more comfortable with friends. / You should talk honestly.</p><p>All examples below are original practice sentences, not song lyrics.</p>');D.quiz.forEach((q,i)=>h+=card('<h3>'+q[0]+'</h3>'+quiz(q,i,'a')))}
if(m===5)D.chat.forEach((q,i)=>h+=card('<div style="max-width:360px;margin:auto;background:#22242D;padding:12px;border-radius:20px"><p style="color:white">'+q[0]+'</p><div style="background:#F5F2EF;padding:15px;border-radius:12px">'+esc(q[1])+'</div>'+(s.chat[i]===undefined?'':'<p style="background:#B98562;padding:12px;border-radius:12px">'+esc(q[2][s.chat[i]])+'</p>')+'</div><p>Choose the best reply. Then give your own reply aloud.</p>'+quiz([q[1],q[2],q[3],q[4]],i,'chat')));
if(m===6)h+=card('<h3>Create an alternative ending</h3><p>Imagine the narrator talks honestly to the person she likes. Write 5–8 sentences about what happens next. The ending can be romantic, friendly or independent.</p><p>Use at least two adjectives, one comparative and one sentence with should.</p><p>Start: One day, she decides to… / She feels… / Her friend says… / In the end…</p>'+note('create','My alternative ending…')+check('create','I presented my ending and explained my choices.'));
if(m===7)h+=card('<h3>60-second speaking quest</h3><p>Summarize the song in your own words, describe two feelings, compare two people or situations, and give one piece of advice.</p>'+check('final','I completed the speaking task.')+'<h3>Reflection</h3><p>Which words can you use in real life? What helped you understand the song?</p>'+note('reflect','My reflection…')+check('reflect','I reflected on my learning.')+'<h3>Results</h3><p>'+s.done.length+'/8 missions · '+s.done.length*50+'/400 XP · '+s.skip.length+' skipped</p><p>Vocabulary '+s.seen.length+'/6 · Grammar '+D.quiz.filter((q,i)=>s.a[i]===q[2]).length+'/6 · Chat '+D.chat.filter((q,i)=>s.chat[i]===q[3]).length+'/4</p>');
h+=card('<div class="row"><button onclick="go(Math.max(0,s.m-1))">Previous</button><button class="primary" onclick="complete()" '+(!ready()||s.done.includes(m)?'disabled':'')+'>'+(s.done.includes(m)?'Completed ✓':'Complete +50 XP')+'</button><button onclick="skip()">Skip mission</button><button onclick="go(Math.min(7,s.m+1))" '+(m===7?'disabled':'')+'>Next mission</button></div>');$('content').innerHTML=h}function reset(){if(confirm('Reset progress?')){s=fresh();draw()}}render();
</script></body></html>
