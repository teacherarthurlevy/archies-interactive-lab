<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Leadership Room | Education With Archie</title><style>
*{box-sizing:border-box}body{margin:0;background:#F5F2EF;color:#22242D;font:16px/1.6 'DejaVu Sans',Arial,sans-serif}header{background:#22242D;color:#fff;padding:30px 5%}small,.accent{color:#B98562;font-weight:bold;letter-spacing:1px}h1{font-size:clamp(30px,5vw,48px);margin:8px 0}h2{line-height:1.2}button,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 15px;background:#22242D;color:white;margin:4px}button.secondary{background:#F5F2EF;color:#22242D;border:1px solid #B98562}button:focus-visible{outline:3px solid #B98562;outline-offset:2px}.layout{display:grid;grid-template-columns:250px 1fr}aside{background:white;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}nav button{display:block;width:100%;text-align:left;margin:5px 0;background:#F5F2EF;color:#22242D}nav button.active{background:#22242D;color:white}main{max-width:1000px;width:100%;margin:auto;padding:25px}.card{background:white;border-radius:16px;padding:25px;border:1px solid #ded8d2;margin-bottom:16px}.prompt{background:#F5F2EF;border-left:4px solid #B98562;padding:15px;margin:12px 0;border-radius:6px}.muted{color:#64616A}.bar{height:10px;background:#F5F2EF;border-radius:8px;overflow:hidden}.fill{background:#B98562;height:100%}textarea{width:100%;min-height:130px;padding:12px;border:1px solid #64616A;border-radius:8px}.choices button{display:block;text-align:left;width:100%;background:#F5F2EF;color:#22242D;border:1px solid #ddd}.feedback{font-weight:bold;margin:10px 0}.compact .layout{grid-template-columns:76px 1fr}.compact nav button{font-size:0;text-align:center}.compact nav button:before{content:attr(data-n);font-size:16px}.compact aside .extra{display:none}.compact aside{padding:8px}footer{padding:20px;text-align:center;color:#64616A;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:700px){.layout,.compact .layout{display:block}aside{position:relative;height:auto}nav button{display:inline-block;width:auto;font-size:12px}.grid{grid-template-columns:1fr}main{padding:12px}.card{padding:18px}}
</style><header><small>EDUCATION WITH ARCHIE · PROFESSIONAL LAB · B1–B2</small><h1>The Leadership Room</h1><p>Difficult conversations. Effective feedback. Real solutions.</p></header><div class="layout"><aside><button id="collapse" aria-label="Collapse or expand navigation">☰</button><div class="extra"><b>YOUR MISSIONS</b><p class="muted">IT Management · 60–75 min</p></div><nav id="nav"></nav><p id="progress" aria-live="polite"></p><div class="bar"><div class="fill" id="fill"></div></div><button id="reset" class="secondary extra">Reset progress</button></aside><main><div id="content"></div><div><button id="prev" class="secondary">← Previous</button><button id="skip" class="secondary">Skip / Next · no XP</button><button id="complete">Complete · +50 XP</button></div><p id="status" role="status"></p></main></div><footer>UNDERSTAND → NOTICE → PRACTICE → CREATE → SPEAK → REVIEW<br>ANYBODY CAN SPEAK ENGLISH, YOU JUST DON'T KNOW YET.</footer><script>
const names=['Warm-up','Vocabulary','Language focus','Decision room','Branching meeting','Role-play','Action plan','Final quest'];const key='ewa-leadership-room-v1';let s={i:0,done:[],v:0,reveal:false,answers:{},case:0,decision:null,branch:0,notes:{},checks:[]};try{Object.assign(s,JSON.parse(localStorage.getItem(key))||{})}catch(e){}const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}function go(i){s.i=Math.max(0,Math.min(7,i));save();render();window.scrollTo(0,0)}const vocab=[['accountability','responsabilidade pelos resultados','Taking responsibility for commitments and outcomes.','We need clear accountability for each ticket.'],['underperformance','desempenho abaixo do esperado','Performance below an agreed standard.','Let’s discuss the recent underperformance.'],['constructive feedback','feedback construtivo','Specific feedback intended to help someone improve.','Give constructive feedback in private.'],['follow through','cumprir o combinado','Complete an action you promised to take.','Please follow through on the agreed actions.'],['root cause','causa raiz','The underlying reason for a problem.','We need to identify the root cause.'],['improvement plan','plano de melhoria','A set of actions and measurable goals for improvement.','Let’s agree on an improvement plan.']];const quiz=[['Which opening is more constructive?',['You never do your job.','I noticed two tickets missed their deadlines. Can we discuss what happened?'],1,'Describe observable behavior rather than attacking character.'],['Choose a diplomatic request.',['Could you update the board by 4 p.m.?','You must to update the board.'],0,'Could you + base verb is a polite request.'],['If we clarify the requirements, we ___ reduce rework.',['will','would have'],0,'First conditional: if + present simple, will + base verb.'],['Which sentence expresses a clear obligation?',['You need to flag blockers early.','You need flag blockers early.'],0,'Need to + base verb.'],['Which response investigates the cause?',['Why are you so careless?','What prevented you from finishing the task?'],1,'Ask about the situation rather than labeling the person.'],['Choose a measurable agreement.',['Do better soon.','Update each assigned ticket before the daily stand-up this week.'],1,'A specific action and timeframe make follow-up possible.']];const cases=[{title:'The missed deadlines',fact:'Alex missed two agreed sprint deadlines and did not flag the blockers. The release is at risk.',options:['Publicly criticize Alex at stand-up.','Meet privately, ask about blockers, and agree on early escalation.','Reassign every task without discussion.'],feedback:['Public criticism may damage trust and does not reveal the cause.','A private conversation combines accountability and support. Agree on a daily status update and review in one week.','Reassignment may protect a deadline temporarily, but the underlying problem remains.']},{title:'The defensive developer',fact:'Jordan interrupts code reviews and dismisses teammates’ feedback. Two teammates have stopped contributing.',options:['Ignore it because Jordan is technically strong.','Describe the interruptions, explain their impact, and agree on review rules.','Tell Jordan that nobody likes working with them.'],feedback:['Ignoring the behavior may reinforce it.','Focus on observable behavior and establish a respectful review process.','Personal attacks make improvement harder.']},{title:'The silent teammate',fact:'Sam rarely updates the task board. Other teams cannot plan around dependencies.',options:['Assume Sam is lazy.','Ask about workload and tools; agree on a daily update deadline.','Add three mandatory meetings every day.'],feedback:['The cause is not yet known.','Investigate first, then set a measurable expectation and check progress.','Extra meetings may increase workload without solving the cause.']},{title:'The repeated production mistakes',fact:'Taylor skipped the agreed review checklist twice. A recent deployment needed rollback.',options:['Ban Taylor from all future deployments.','Review the incidents privately, check training gaps, and require checklist sign-off.','Ignore the issue because the rollback worked.'],feedback:['Temporary safeguards may be needed, but a permanent ban without investigation is disproportionate.','Combine immediate safeguards with training, clear expectations and follow-up.','Ignoring repeated process failures increases risk.']}];const branch=[['Alex: “I missed the deadline because the requirements kept changing.”',['That is just an excuse.','Can you walk me through the changes and when you noticed the risk?'],['Alex becomes defensive. Try a question that separates facts from blame.','Alex explains that the acceptance criteria changed twice.'],[0,1]],['Alex: “I didn’t know I had to escalate it.”',['Let’s agree that you flag any deadline risk the same day.','Fine, just try harder.'],['Alex agrees and asks how to report the risk.','The expectation remains unclear. Try a specific action.'],[2,1]],['Alex: “Can we review the new process next week?”',['Yes. We’ll review ticket updates next Friday and adjust if needed.','No, we never need to discuss this again.'],['You have a measurable agreement and a follow-up date.','Without follow-up, it is difficult to assess improvement.'],[3,2]]];function note(id,placeholder){return '<textarea data-note="'+id+'" placeholder="'+placeholder+'"></textarea><button class="secondary" data-copy="'+id+'">Copy response</button>'}function choices(items,attr){return '<div class="choices">'+items.map((x,i)=>'<button '+attr+'="'+i+'">'+x+'</button>').join('')+'</div>'}function render(){ $('nav').innerHTML=names.map((n,i)=>'<button data-go="'+i+'" data-n="'+(i+1)+'" class="'+(s.i===i?'active':'')+'">'+(i+1)+' · '+n+(s.done.includes(i)?' ✓':'')+'</button>').join('');$('progress').textContent=s.done.length+'/8 · '+s.done.length*50+'/400 XP';$('fill').style.width=s.done.length/8*100+'%';let h='';switch(s.i){case 0:h='<h2>What makes a difficult team member?</h2><p>Discuss fictional or non-confidential examples.</p><div class="prompt">What is harder: a missed deadline or a bad attitude?<br>When should a manager intervene?<br>How do you distinguish a skills gap from a motivation problem?<br>What makes feedback effective?</div><p>Speak for 60 seconds: “One challenge I face as a manager is…”</p>'+note('warm','Class notes');break;case 1:{let v=vocab[s.v];h='<h2>Leadership vocabulary</h2><p>Card '+(s.v+1)+' / 6</p><div class="prompt"><h2>'+v[0]+'</h2>'+(s.reveal?'<b>'+v[1]+'</b><p>'+v[2]+'</p><i>'+v[3]+'</i>':'')+'</div><button id="reveal">Reveal / Hide</button><button id="nextv" class="secondary">Next card</button><button id="skipv" class="secondary">Skip card</button><button id="skipall" class="secondary">Skip vocabulary</button><p>Use three expressions in a conversation about your team.</p>';break}case 2:h='<h2>Be direct, not aggressive</h2><div class="grid"><div class="prompt"><b>Describe the behavior</b><p>I noticed that two deadlines were missed.</p><b>Explain the impact</b><p>This affects our release schedule.</p></div><div class="prompt"><b>Ask and agree</b><p>Could you explain what happened?<br>You need to flag risks earlier.<br>If we improve communication, we will reduce delays.</p></div></div>'+quiz.map((q,i)=>'<div class="prompt"><b>'+q[0]+'</b>'+q[1].map((a,j)=>'<button class="secondary" data-q="'+i+'" data-a="'+j+'">'+a+'</button>').join('')+'<div class="feedback">'+(s.answers[i]===undefined?'':(s.answers[i]===q[2]?'Correct. ':'Try again. ')+q[3])+'</div></div>').join('')+'<button id="retry" class="secondary">Retry quiz</button>';break;case 3:{let c=cases[s.case];h='<h2>The decision room</h2><p>Case '+(s.case+1)+' of 4</p><div class="prompt"><h3>'+c.title+'</h3>'+c.fact+'</div>'+choices(c.options,'data-decision')+(s.decision===null?'':'<div class="prompt">'+c.feedback[s.decision]+'</div>')+'<button id="nextcase">Next case →</button><p>Explain your decision: What is the problem? What is its impact? What is your solution? How will you measure improvement?</p>'+note('case'+s.case,'My decision and next steps');break}case 4:{let b=branch[s.branch];h='<h2>The private feedback meeting</h2>'+(b?'<div class="prompt">'+b[0]+'</div>'+choices(b[1],'data-branch')+'<div id="reaction" aria-live="polite"></div>':'<div class="prompt">Meeting complete. You identified the cause, agreed on an action and scheduled a review.</div>')+'<button id="restart" class="secondary">Restart conversation</button>';break}case 5:h='<h2>Leadership role-play</h2><div class="prompt"><b>Round A — Missed deadlines</b><p>Teacher: developer who feels overloaded. Student: manager. Investigate workload, negotiate priorities, and agree on a realistic deadline.</p></div><div class="prompt"><b>Round B — Team conflict</b><p>Teacher: developer who rejects feedback. Student: manager. Give a specific example, listen to their perspective, and establish a respectful code-review agreement.</p></div><div class="prompt"><b>Round C — No improvement</b><p>Two weeks later, the agreed behavior has not improved. Discuss evidence, support, expectations and appropriate next steps under company policy.</p></div><p>Use: “I noticed…”, “Could you explain…?”, “What support do you need?”, “Let’s agree on…”, “If this continues…”</p>';break;case 6:h='<h2>Build an improvement plan</h2><p>Choose one fictional case. Write a concise plan with observable behavior, impact, employee perspective, agreed action, support, measurable target and review date.</p><div class="prompt">Example: Update every assigned ticket before stand-up for the next five working days. Manager provides board training on Monday. Review on Friday.</div>'+note('plan','Problem:\nImpact:\nEmployee perspective:\nAction and support:\nSuccess measure:\nReview date:');break;case 7:h='<h2>Final leadership challenge</h2><p>Give a 90-second briefing to your director: explain the issue, what the employee said, your solution, expected results and follow-up.</p><div class="prompt">“The main issue is… This has affected… We agreed to… If we follow this plan, we will… We’ll review progress on…”</div>'+['I can describe a performance issue objectively.','I can give diplomatic feedback.','I can propose a measurable solution.','I can explain follow-up actions.'].map((x,i)=>'<p><label><input type="checkbox" data-check="'+i+'" '+(s.checks[i]?'checked':'')+'> '+x+'</label></p>').join('')+note('reflection','What will I apply in my next meeting?')+'<p><b>Progress: '+s.done.length+'/8 missions · '+s.done.length*50+' XP</b></p>';break} $('content').innerHTML='<article class="card"><small class="accent">MISSION '+String(s.i+1).padStart(2,'0')+' · '+names[s.i].toUpperCase()+'</small>'+h+'</article>';document.querySelectorAll('[data-note]').forEach(t=>{t.value=s.notes[t.dataset.note]||'';t.oninput=()=>{s.notes[t.dataset.note]=t.value;save()}});$('prev').disabled=s.i===0;$('complete').textContent=s.done.includes(s.i)?'Completed ✓':'Complete · +50 XP';$('complete').disabled=s.done.includes(s.i);}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.go!==undefined)return go(+d.go);if(d.q!==undefined){s.answers[d.q]=+d.a;save();render()}if(d.decision!==undefined){s.decision=+d.decision;save();render()}if(d.branch!==undefined){let o=branch[s.branch],j=+d.branch;$('reaction').innerHTML='<p class="prompt">'+o[2][j]+'</p><button id="continue" data-target="'+o[3][j]+'">Continue →</button>'}if(d.copy!==undefined){let t=s.notes[d.copy]||'';if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>$('status').textContent='Copied.').catch(()=>$('status').textContent='Please select and copy the text.');else $('status').textContent='Please select and copy the text.'}switch(b.id){case 'prev':go(s.i-1);break;case 'skip':go(s.i+1);$('status').textContent='Skipped — no XP awarded.';break;case 'complete':if(!s.done.includes(s.i))s.done.push(s.i);go(s.i+1);$('status').textContent='Mission completed. +50 XP.';break;case 'collapse':document.body.classList.toggle('compact');break;case 'reset':if(confirm('Reset this lesson?')){localStorage.removeItem(key);location.reload()}break;case 'reveal':s.reveal=!s.reveal;save();render();break;case 'nextv':case 'skipv':s.v=(s.v+1)%6;s.reveal=false;save();render();break;case 'skipall':go(2);break;case 'retry':s.answers={};save();render();break;case 'nextcase':s.case=(s.case+1)%cases.length;s.decision=null;save();render();break;case 'continue':s.branch=+d.target;save();render();break;case 'restart':s.branch=0;save();render();break}});document.addEventListener('change',e=>{if(e.target.dataset.check!==undefined){s.checks[e.target.dataset.check]=e.target.checked;save()}});render();</script></html>
